*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f7f7f7;color:#1a1a1a;font-size:14px;line-height:1.6}

/* TOP BAR */

.search-section{background:#fff;border-bottom:1px solid #e0e0e0;padding:14px 20px}

/* MAIN */
.main{max-width:960px;margin:0 auto;padding:20px;display:none}
.main.active{display:block}

/* STATS */
.stats{display:flex;gap:20px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #e8e8e8}
.stat{font-size:12px;color:#888}.stat b{color:#333;font-weight:600}

.unit-card{background:#fff;border:1px solid #e4e4e4;border-radius:8px;margin-bottom:10px;overflow:hidden}

.unit-card.open .unit-arrow{transform:rotate(90deg)}

.pill-l{background:#f9fafb;color:#6b7280;border:1px solid #e5e7eb}

table.q-tbl tbody tr{border-bottom:1px solid #f3f3f3;transition:background 0.1s}

td.q-td{padding:9px 12px;vertical-align:top}

.q-expr{font-family:'JetBrains Mono',monospace;font-size:11px;background:#f0f7ff;border:1px solid #bfdbfe;border-radius:4px;padding:3px 8px;margin-top:4px;display:inline-block;color:#1d4ed8}
.marks-badge{font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 8px;border-radius:10px;display:inline-block;font-weight:500}

.mb-med{background:#fef9c3;color:#854d0e;border:1px solid #fde68a}
.mb-low{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}

  document.getElementById('sub-cn').classList.toggle('active',s==='cn');
  document.getElementById('sub-coa').classList.toggle('active',s==='coa');
  document.getElementById('search').value='';
  filterAll();
}

function mClass(m){const n=parseInt(m);return n>=8?'mb-high':n>=4?'mb-med':'mb-low';}
function fClass(f){return f>=4?'freq-hi':f>=2?'freq-md':'freq-lo';}
function yClass(y){if(y==='Model Q')return 'ytag-m';if(y.endsWith('B')||y.includes('Back'))return 'ytag-b';return 'ytag-r';}

function renderSubject(data, subId, unitsId, statsId) {
  const container = document.getElementById(unitsId);
  const statsEl   = document.getElementById(statsId);
  container.innerHTML = '';
  let totalQ=0; const years=new Set();

  data.forEach((unit,ui)=>{
    const col = COLORS[ui%COLORS.length];
    totalQ += unit.qs.length;
    unit.qs.forEach(q=>q.years.forEach(y=>years.add(y)));

    // concepts HTML
    const cH=(unit.concepts.h||[]).map(c=>`<span class="pill pill-h">${c}</span>`).join('');
    const cM=(unit.concepts.m||[]).map(c=>`<span class="pill pill-m">${c}</span>`).join('');
    const cL=(unit.concepts.l||[]).map(c=>`<span class="pill pill-l">${c}</span>`).join('');
    const conceptsInner=`
      ${cH?`<div class="cg"><span class="cg-lbl h">HIGH</span><div class="pills">${cH}</div></div>`:''}
      ${cM?`<div class="cg"><span class="cg-lbl m">MED</span><div class="pills">${cM}</div></div>`:''}
      ${cL?`<div class="cg"><span class="cg-lbl l">LOW</span><div class="pills">${cL}</div></div>`:''}`;

    // question rows
    const rows = unit.qs.map(q=>{
      const yTags=q.years.map(y=>`<span class="ytag ${yClass(y)}">${y}</span>`).join('');
      const expr=q.expr?`<div class="q-expr">${q.expr}</div>`:'';
      const searchStr=(unit.title+' '+q.t+' '+q.years.join(' ')).toLowerCase();
      return `<tr data-text="${searchStr.replace(/"/g,'&quot;')}">
        <td class="q-td"><div class="q-text">${q.t}${expr}</div></td>
        <td class="q-td" style="text-align:center;white-space:nowrap"><span class="marks-badge ${mClass(q.m)}">${q.m}</span></td>
        <td class="q-td freq-cell"><span class="freq-num ${fClass(q.freq)}">${q.freq}×</span></td>
        <td class="years-td"><div class="ytags">${yTags}</div></td>
      </tr>`;
    }).join('');

    const card = document.createElement('div');
    card.className='unit-card';
    card.id=unit.id+'_'+subId;
    card.innerHTML=`
      <div class="unit-hdr" onclick="toggleUnit(this)">
        <span class="unit-badge" style="background:${col}">U${ui+1}</span>
        <span class="unit-name">${unit.title}</span>
        <div class="unit-meta">
          <span class="unit-qcount">${unit.qs.length}q</span>
          <span class="unit-arrow">&#9658;</span>
        </div>
      </div>
      <div class="concepts-toggle-wrap" style="display:none">
        <button class="concepts-toggle" onclick="toggleConcepts(this,event)">&#9670; Key Concepts</button>
        <div class="concepts-bar">${conceptsInner}</div>
      </div>
      <div class="q-wrap">
        <table class="q-tbl">
          <thead><tr>
            <th>Question</th>
            <th class="tc" style="width:80px">Marks</th>
            <th class="tc" style="width:55px">Freq</th>
            <th style="width:160px">Year(s)</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    container.appendChild(card);
  });

  statsEl.innerHTML=`<div class="stat"><b>${totalQ}</b> questions</div>
    <div class="stat"><b>${data.length}</b> units</div>
    <div class="stat"><b>${years.size}</b> exam sessions</div>
    <div class="stat" style="font-size:11px;color:#bbb;margin-left:auto">Click a chapter to expand · Click "Key Concepts" to toggle</div>`;
}

function toggleUnit(hdr){
  const card=hdr.parentElement;
  const isOpen=card.classList.toggle('open');
  const ctWrap=card.querySelector('.concepts-toggle-wrap');
  ctWrap.style.display=isOpen?'':'none';
  if(!isOpen){
    card.querySelector('.concepts-bar').classList.remove('visible');
  }
}

function toggleConcepts(btn,e){
  e.stopPropagation();
  const bar=btn.nextElementSibling;
  bar.classList.toggle('visible');
}

function filterAll(){
  const val=document.getElementById('search').value.toLowerCase().trim();
  const sub=curSub;
  document.querySelectorAll(`#sub-${sub} .q-tbl tbody tr`).forEach(row=>{
    row.classList.toggle('hidden',!!(val&&!row.dataset.text.includes(val)));
  });
  document.querySelectorAll(`#sub-${sub} .unit-card`).forEach(card=>{
    if(!val){card.style.display='';return;}
    const any=[...card.querySelectorAll('.q-tbl tbody tr')].some(r=>!r.classList.contains('hidden'));
    card.style.display=any?'':'none';
    if(any&&!card.classList.contains('open')){
      card.classList.add('open');
      card.querySelector('.concepts-toggle-wrap').style.display='';
    }
  });
}

renderSubject(CN,'cn','cn-units','cn-stats');
renderSubject(COA,'coa','coa-units','coa-stats');
</script>
